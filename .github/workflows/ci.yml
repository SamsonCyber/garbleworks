name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-repro:
    name: security + math audit (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Independent offline repro
        # Same entry point documented in STATUS.md and profile maturity matrix.
        # Full backend pytest still includes lab/live modules not shipped publicly.
        run: python scripts/repro.py
