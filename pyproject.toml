[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garbleworks"
version = "1.0.0"
description = "Authorized LLM red-team harness: modular ops, one fire policy, offline repro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]
